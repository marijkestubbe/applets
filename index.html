<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Applets Wetenschappen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* LAYOUT: drie modulekolommen als laden van een labokast; per module thema's met hun applets. Gestapeld op smalle schermen. */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --ink:#18201d; --muted:#5a6661; --line:#dbe2df;
  --bio:#2f8a4e; --bio-soft:#e4f3e8;
  --chem:#b25a12; --chem-soft:#fbeedd;
  --fys:#1f5fbf; --fys-soft:#e3ecfa;
  --display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201d; --ink:#e8eeeb; --muted:#9aa7a1; --line:#2a3430;
  --bio:#5cc27f; --bio-soft:#1a2c21; --chem:#e8964f; --chem-soft:#30231a; --fys:#6ea2f0; --fys-soft:#1a2436;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201d; --ink:#e8eeeb; --muted:#9aa7a1; --line:#2a3430;
  --bio:#5cc27f; --bio-soft:#1a2c21; --chem:#e8964f; --chem-soft:#30231a; --fys:#6ea2f0; --fys-soft:#1a2436;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-direction:column;gap:6px;margin-bottom:32px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,5vw,52px);line-height:1.02;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:60ch}
.modules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.module{--c:var(--fys);--soft:var(--fys-soft);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.module[data-m="biologie"]{--c:var(--bio);--soft:var(--bio-soft)}
.module[data-m="chemie"]{--c:var(--chem);--soft:var(--chem-soft)}
.module>h2{margin:0;padding:14px 18px;background:var(--soft);color:var(--c);font-family:var(--display);font-weight:800;font-size:26px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:3px solid var(--c)}
.module>h2 span{font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted)}
.themes{display:flex;flex-direction:column;gap:18px;padding:18px}
.theme h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.theme ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.applet{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;transition:border-color .15s,background .15s}
.applet:hover{border-color:var(--c);background:var(--soft)}
.applet:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.applet strong{font-size:18px;display:flex;justify-content:space-between;gap:8px}
.applet strong::after{content:"→";color:var(--c)}
.applet small{color:var(--muted);font-size:14px}
.empty{color:var(--muted);font-size:15px;margin:0;padding:12px 14px;border:1.5px dashed var(--line);border-radius:10px}
@media (max-width:900px){.modules{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.applet{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Applets Wetenschappen</h1>
    <p>Alle applets uit de lessen, per module en per thema. Klik op een applet om ze te openen.</p>
  </header>
  <main class="modules" id="modules"></main>
</div>
<script>
/* Nieuwe applet toevoegen: zet het bestand in de map van de module
   en voeg hieronder een regel toe bij het juiste thema. */
const MODULES = [
  { id: "biologie", naam: "Biologie", themas: [] },
  { id: "chemie",   naam: "Chemie",   themas: [] },
  { id: "fysica",   naam: "Fysica",   themas: [
    { naam: "Krachten", applets: [
      { titel: "Bepalen van de zwaartekracht", bestand: "fysica/dynamometer.html",
        uitleg: "Dynamometer en massa's op de aarde, de maan en andere hemellichamen: Fz = m · g" },
      { titel: "Veerkracht en veerconstante", bestand: "fysica/veerkracht.html",
        uitleg: "Veren met een verschillende k-waarde uitrekken met massa's, met meettabel en grafiek: F = k · Δl" }
    ]},
    { naam: "Druk", applets: [
      { titel: "Hydrostatische druk", bestand: "fysica/druk.html",
        uitleg: "Vliesmanometer met U-buis in een bekerglas: hemellichaam, vloeistof en diepte wisselen, met totale druk: p = ρ · g · h" }
    ]}
  ]}
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("modules").innerHTML = MODULES.map(m => {
  const n = m.themas.reduce((a, t) => a + t.applets.length, 0);
  const body = m.themas.length
    ? m.themas.map(t => `<section class="theme"><h3>${esc(t.naam)}</h3><ul>${
        t.applets.map(a => `<li><a class="applet" href="${esc(a.bestand)}"><strong>${esc(a.titel)}</strong>${a.uitleg ? `<small>${esc(a.uitleg)}</small>` : ""}</a></li>`).join("")
      }</ul></section>`).join("")
    : `<p class="empty">Nog geen applets in deze module.</p>`;
  return `<section class="module" data-m="${m.id}"><h2>${esc(m.naam)}<span>${n} applet${n === 1 ? "" : "s"}</span></h2><div class="themes">${body}</div></section>`;
}).join("");
</script>
</body>
</html>
